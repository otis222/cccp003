  /* ---------- 與首頁相同的配色 ---------- */
  :root {
    --paper: #EEE5D0; --paper-2: #F7F1E2; --paper-3: #E8DDC4;
    --ink: #211A16; --ink-2: #5E5148; --ink-3: #8F8173;
    --rule: rgba(33, 26, 22, .22); --rule-2: rgba(33, 26, 22, .09);
    --accent: #E0522A; --accent-ink: #1A100C; --acc-tx: #AE3B19;
    --s1: #8C2F2B; --s2: #E0522A; --s3: #E8A93C; --s4: #2C6E7D;
    --ground: radial-gradient(120% 95% at 70% 30%, #F6EEDC 0%, #EEE5D0 50%, #E2D6BB 100%);
    --f-display: "Lab Display", "Century Gothic", "Avenir Next", "Futura", system-ui, sans-serif;
    --f-cjk: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    --f-mono: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    /* 遊戲畫面本身（雷達螢幕）在每種配色都維持深色 */
    --scope: #04101a;
    --g: #3dff7a;
    --scr-tx: #E8F7EE;
    --frame: 14px;
    --board: clamp(200px, min(calc(100vw - 64px), calc(100vh - 270px)), 560px);
  }
  :root[data-palette="cyano"] {
    --paper: #E3EBEE; --paper-2: #F1F5F6; --paper-3: #D9E3E7;
    --ink: #123A5C; --ink-2: #47667E; --ink-3: #7F98AA;
    --rule: rgba(18, 58, 92, .22); --rule-2: rgba(18, 58, 92, .09);
    --accent: #C23F24; --accent-ink: #FFF4EF; --acc-tx: #B03A20;
    --s1: #123A5C; --s2: #1F6FA3; --s3: #7FB2D3; --s4: #C23F24;
    --ground: linear-gradient(160deg, #F0F5F6 0%, #E3EBEE 48%, #CFDCE2 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17120F; --paper-2: #201915; --paper-3: #2A211B;
      --ink: #F2E8D4; --ink-2: #B7A994; --ink-3: #7E7262;
      --rule: rgba(242, 232, 212, .18); --rule-2: rgba(242, 232, 212, .07);
      --accent: #F0663A; --accent-ink: #1A0E09; --acc-tx: #F48159;
      --s1: #B5463F; --s2: #F0663A; --s3: #E9B04A; --s4: #5FA3B0;
      --ground: radial-gradient(120% 95% at 70% 30%, #2C211A 0%, #17120F 55%, #0F0B09 100%);
      color-scheme: dark;
    }
    :root[data-palette="cyano"] {
      --paper: #0D2A44; --paper-2: #113352; --paper-3: #173D5F;
      --ink: #EEF4F7; --ink-2: #A9C1D1; --ink-3: #6E8DA3;
      --rule: rgba(238, 244, 247, .2); --rule-2: rgba(238, 244, 247, .08);
      --accent: #F2A65A; --accent-ink: #1B1006; --acc-tx: #F5B877;
      --s1: #EEF4F7; --s2: #8FD0F0; --s3: #4F8DB8; --s4: #F2A65A;
      --ground: radial-gradient(120% 95% at 70% 30%, #18476F 0%, #0D2A44 55%, #081D30 100%);
      color-scheme: dark;
    }
  }
  @supports (height: 100dvh) {
    :root { --board: clamp(200px, min(calc(100vw - 64px), calc(100dvh - 270px)), 560px); }
  }
  /* 觸控按鈕出現時，預留下方十字鍵的空間 */
  @media (hover: none), (pointer: coarse), (max-width: 700px) {
    :root { --frame: 8px; --board: clamp(200px, min(calc(100vw - 48px), calc(100vh - 350px)), 560px); }
    @supports (height: 100dvh) {
      :root { --board: clamp(200px, min(calc(100vw - 48px), calc(100dvh - 350px)), 560px); }
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background-color: var(--paper);
    background-image: var(--ground);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--f-cjk);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- 頂端列（與首頁相同的膠囊按鈕） ---------- */
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 14px 0;
    padding-top: max(12px, env(safe-area-inset-top));
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    padding: 9px 16px 8px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    background: var(--paper-2);
    color: var(--ink);
    font: 700 14px/1 var(--f-cjk);
    letter-spacing: .02em;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 4px 5px 0 -1px var(--rule);
  }
  .back:hover, .back:focus-visible { background: var(--ink); color: var(--paper-2); }

  .wrap {
    width: 100%;
    max-width: 680px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 4px 12px 14px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
  }

  .title { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  h1 {
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
    font: 900 clamp(26px, 5vw, 36px)/1 var(--f-cjk);
    letter-spacing: .04em;
  }
  h1 em { font: 700 .42em/1 var(--f-display); font-style: normal; letter-spacing: .16em; color: var(--ink-2); }
  .stripe { display: flex; width: 132px; height: 5px; }
  .stripe i { flex: 1; }
  .stripe i:nth-child(1) { background: var(--s1); }
  .stripe i:nth-child(2) { background: var(--s2); }
  .stripe i:nth-child(3) { background: var(--s3); }
  .stripe i:nth-child(4) { background: var(--s4); }

  .hud {
    width: calc(var(--board) + var(--frame) * 2);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font: 500 clamp(13px, 3.4vw, 15px)/1.2 var(--f-cjk);
    color: var(--ink-2);
  }
  .hud b { margin-left: 4px; font: 700 clamp(16px, 4vw, 20px)/1 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
  .hud .boost {
    padding: 6px 10px 5px;
    border: 1.5px solid var(--rule);
    border-radius: 999px;
    font: 700 11px/1 var(--f-cjk);
    letter-spacing: .08em;
    color: var(--ink-3);
  }
  .hud .boost.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ---------- 儀器面板 + 雷達螢幕 ---------- */
  .monitor {
    padding: var(--frame);
    background: var(--paper-2);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    box-shadow: 6px 8px 0 -1px var(--rule);
  }
  .screen {
    position: relative;
    width: var(--board);
    height: var(--board);
    background: var(--scope);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: inset 0 0 24px rgba(0, 0, 0, .6);
    animation: flicker 4s infinite;
    touch-action: none;      /* 在畫面上滑動控制方向時，不要捲動頁面 */
  }
  .screen.shake { animation: shake .4s, flicker 4s infinite; }
  canvas { width: 100%; height: 100%; display: block; }

  /* 掃描線與暗角調淡，角落也看得清楚蛇身 */
  .scan {
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0, 0, 0, .15) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 62%, rgba(0, 0, 0, .25) 100%);
  }
  .scan::after {
    content: "";
    position: absolute; left: 0; right: 0; height: 22%;
    background: linear-gradient(to bottom, transparent, rgba(61, 255, 122, .05), transparent);
    animation: roll 6s linear infinite;
  }
  @keyframes roll { from { top: -25%; } to { top: 110%; } }
  @keyframes flicker {
    0%, 100% { opacity: 1; } 50% { opacity: .975; }
  }
  @keyframes shake {
    0%, 100% { transform: translate(0); } 20% { transform: translate(-4px, 2px); }
    40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, -2px); } 80% { transform: translate(3px, 2px); }
  }

  /* ---------- 螢幕上的覆蓋畫面 ---------- */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--board) * .03);
    background: rgba(2, 10, 16, .93);
    color: var(--scr-tx);
    text-align: center;
    padding: 0 8%;
  }
  .overlay.hide { display: none; }
  .overlay h2 {
    margin: 0;
    font: 900 calc(var(--board) * .088)/1.1 var(--f-cjk);
    letter-spacing: .12em;
    color: var(--g);
    text-shadow: 0 0 10px rgba(61, 255, 122, .55);
  }
  .overlay p {
    margin: 0;
    font-size: calc(var(--board) * .044);
    line-height: 1.6;
  }
  .overlay .new { color: #ffb43a; font-weight: 700; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font: 700 calc(var(--board) * .05)/1 var(--f-cjk);
    letter-spacing: .06em;
    padding: .66em 1.4em .6em;
    border: 1.5px solid var(--accent);
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; filter: none; }
  .btn.sm { font-size: clamp(13px, calc(var(--board) * .04), 18px); padding: .6em 1.05em .55em; letter-spacing: .03em; }
  .overlay .btn.ghost { background: transparent; border-color: rgba(232, 247, 238, .5); color: var(--scr-tx); }
  .overlay .btn:focus-visible { outline-color: var(--scr-tx); }

  .ov-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

  /* ---------- 存分數 ---------- */
  .save { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  .save input {
    flex: 1;
    min-width: 0;
    font: 500 16px/1.2 var(--f-cjk);  /* 16px 以上，手機點輸入框才不會自動放大 */
    color: var(--scr-tx);
    background: rgba(255, 255, 255, .07);
    border: 1.5px solid rgba(232, 247, 238, .42);
    border-radius: 999px;
    padding: .55em .95em .5em;
    user-select: text;
    -webkit-user-select: text;
  }
  .save input::placeholder { color: rgba(232, 247, 238, .55); }
  .save input:focus { outline: none; border-color: var(--g); box-shadow: 0 0 0 3px rgba(61, 255, 122, .18); }
  .overlay p.msg { font-size: clamp(12px, calc(var(--board) * .038), 17px); min-height: 1.6em; color: rgba(232, 247, 238, .72); }
  .overlay p.msg.ok { color: #ffb43a; }
  .overlay p.msg.err { color: #ff8f7c; }

  /* ---------- 排行榜視窗（首頁的面板樣式） ---------- */
  .lb {
    width: min(420px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    padding: 22px 22px 18px;
    color: var(--ink);
    background: var(--paper-2);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    box-shadow: 6px 8px 0 -1px var(--rule);
    font-family: var(--f-cjk);
  }
  .lb::backdrop { background: rgba(10, 7, 5, .45); }
  .lb h2 {
    margin: 0 0 6px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    font: 900 24px/1.1 var(--f-cjk);
    letter-spacing: .04em;
  }
  .lb h2 em { font: 700 11px/1 var(--f-display); font-style: normal; letter-spacing: .16em; color: var(--ink-2); }
  .lb-rule { margin: 0 0 6px; padding-bottom: 12px; border-bottom: 1.5px solid var(--ink); font-size: 13px; color: var(--ink-2); }
  .lb-status { margin: 10px 0; text-align: center; font-size: 14px; color: var(--ink-2); line-height: 1.6; }
  .lb-status.err { color: var(--acc-tx); }
  .lb-status.mine { color: var(--acc-tx); font-weight: 700; }
  .lb-list { list-style: none; margin: 0; padding: 0; font-size: 16px; }
  .lb-list li {
    display: grid;
    grid-template-columns: 2.6em 1fr auto;
    gap: 8px;
    align-items: baseline;
    padding: 8px 8px 7px;
    border-bottom: 1px dashed var(--rule);
  }
  .lb-list .rk { font: 700 13px/1.5 var(--f-mono); color: var(--ink-3); }
  .lb-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; user-select: text; -webkit-user-select: text; }
  .lb-list .sc { font: 700 15px/1.5 var(--f-mono); font-variant-numeric: tabular-nums; }
  .lb-list li:nth-child(-n+3) .rk { color: var(--acc-tx); }
  .lb-list li.me { background: rgba(232, 169, 60, .24); border-radius: 6px; }
  .lb .ov-row { margin-top: 16px; }
  .lb .btn { font-size: 15px; }
  .lb .btn.ghost { background: transparent; border-color: var(--ink); color: var(--ink); }

  /* ---------- 說明與觸控按鈕 ---------- */
  .hint { font-size: 13.5px; color: var(--ink-2); text-align: center; line-height: 1.95; }
  .hint kbd {
    display: inline-block; min-width: 1.75em; padding: 1px .4em 0; margin: 0 1px;
    border: 1.5px solid var(--rule); border-radius: 4px; background: var(--paper-2);
    color: var(--ink); font: 700 12px/1.5 var(--f-mono); text-align: center;
  }

  .pad { display: none; width: calc(var(--board) + var(--frame) * 2); gap: 10px; align-items: stretch; }
  .pad button {
    font: 700 20px/1 var(--f-cjk);
    color: var(--ink);
    background: var(--paper-2);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 0;
    box-shadow: 3px 4px 0 -1px var(--rule);
    touch-action: manipulation;
  }
  .pad button:active, .pad button.pressed { background: var(--ink); color: var(--paper-2); box-shadow: none; }
  /* 十字方向鍵：按哪個方向，蛇就往哪個方向走 */
  .dpad {
    --key: clamp(44px, 13vw, 54px);
    display: grid;
    grid-template-columns: repeat(3, var(--key));
    grid-template-rows: repeat(3, var(--key));
    gap: 4px;
  }
  .dpad .up { grid-area: 1 / 2; }
  .dpad .left { grid-area: 2 / 1; }
  .dpad .right { grid-area: 2 / 3; }
  .dpad .down { grid-area: 3 / 2; }
  .acts { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .acts button { flex: 1; font-size: 17px; letter-spacing: .04em; }
  .acts .boost-btn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .acts .boost-btn.pressed { background: var(--accent); filter: brightness(.88); color: var(--accent-ink); }
  @media (hover: none), (pointer: coarse), (max-width: 700px) {
    .pad { display: flex; }
    .hint { display: none; }
    .title { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .screen, .screen.shake, .scan::after, .overlay .new { animation: none; }
  }
</style>

<body>

  <div class="hint">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 往該方向走　按住 <kbd>Shift</kbd> 加速　<kbd>空白鍵</kbd> 開始／暫停<br>
    吃到食物變長、變快；撞牆或撞到自己就結束，結束後可存分數上排行榜
  </div>

  <div class="pad" id="pad">

<dialog class="lb" id="lb" aria-labelledby="lbTitle">
  <h2 id="lbTitle">排行榜 <em>TOP 10</em></h2>

  <ol class="lb-list" id="lbList"></ol>
  <div class="ov-row">
    <button class="btn sm ghost" id="lbRetry" type="button" hidden>重新整理</button>
    <button class="btn sm" id="lbClose" type="button">關閉</button>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  var COLS = 20, ROWS = 20, CELL = 24;
  var DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];   // 0 上 1 右 2 下 3 左
  var KEYS = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
  var BOOST = 2;        // 加速倍率
  var MIN_STEP = 40;    // 加速時每一步最短的毫秒數
  var HI_KEY = 'snake_crt_hi';
  var NICK_KEY = 'snake_crt_nick';

  // 雲端排行榜：貼上自己的 Apps Script 部署網址（結尾是 /exec）
  var LEADERBOARD_URL = 'https://script.google.com/macros/s/AKfycbzzltWCEhpOivO0RMfiO1dcL2nzpMsLD7I2z8s1RwtNey0FdJhFYEj9PiIdJp-D1Q8/exec';

  // 畫面顏色：底色深藍黑；蛇頭近白、身體由亮綠漸暗到尾巴
  var BG = '#04101a';
  var HEAD = '#f0fff4';
  var NECK = [77, 255, 143], TAIL = [34, 168, 90];

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var elScore = document.getElementById('score');
  var elHi = document.getElementById('hi');
  var elScreen = document.getElementById('screen');
  var boostTag = document.getElementById('boostTag');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovBtn = document.getElementById('ovBtn');
  var btnMid = document.getElementById('btnMid');
  var saveForm = document.getElementById('saveForm');
  var nick = document.getElementById('nick');
  var saveBtn = document.getElementById('saveBtn');
  var saveMsg = document.getElementById('saveMsg');
  var lb = document.getElementById('lb');
  var lbStatus = document.getElementById('lbStatus');
  var lbList = document.getElementById('lbList');
  var lbRetry = document.getElementById('lbRetry');

  var touchUI = !!(window.matchMedia && window.matchMedia('(hover: none), (pointer: coarse)').matches);

  var state = 'ready';        // ready | playing | paused | over
  var snake, dir, queue, food, score, hi, interval, acc = 0, last = 0;
  var round = 0;              // 第幾局；舊的一局送出的請求回來時，不要蓋掉新一局的畫面
  var shiftDown = false, padBoost = false, boostShown = false;
  var prefetch = null, prefetchRound = -1;   // 結束時先讀排行榜，存分數時就不用等

  /* ---------- 最高分 ---------- */
  function loadHi() {
    try { return parseInt(localStorage.getItem(HI_KEY), 10) || 0; } catch (e) { return 0; }
  }
  function saveHi(v) {
    try { localStorage.setItem(HI_KEY, String(v)); } catch (e) { /* 無法儲存就略過 */ }
  }
  hi = loadHi();
  elHi.textContent = hi;

  /* ---------- 遊戲流程 ---------- */
  function reset() {
    var cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = 1;
    queue = [];
    score = 0;
    interval = 150;
    acc = 0;
    elScore.textContent = 0;
    placeFood();
  }

  function placeFood() {
    var free = [];
    var taken = {};
    for (var i = 0; i < snake.length; i++) taken[snake[i].x + ',' + snake[i].y] = true;
    for (var y = 0; y < ROWS; y++)
      for (var x = 0; x < COLS; x++)
        if (!taken[x + ',' + y]) free.push({ x: x, y: y });
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function startGame() {
    reset();
    round++;
    state = 'playing';
    last = performance.now();
    syncUI();
  }

  function togglePause() {
    if (state === 'playing') { state = 'paused'; }
    else if (state === 'paused') { state = 'playing'; last = performance.now(); acc = 0; }
    syncUI();
  }

  // 空白鍵／中間按鈕／覆蓋畫面按鈕：依目前狀態決定動作
  function action() {
    if (state === 'ready' || state === 'over') startGame();
    else togglePause();
  }

  // 按哪個方向就往哪個方向走（不再以蛇頭為準左右轉）
  function setDir(d) {
    if (state !== 'playing') return;
    var prev = queue.length ? queue[queue.length - 1] : dir;
    if (d === prev || d === (prev + 2) % 4) return;   // 同方向不用排隊；正後方會撞到自己，直接忽略
    if (queue.length < 3) queue.push(d);              // 一步之內連按兩下（例如 ↑ 再 ←）也會依序執行
  }

  function boosting() { return state === 'playing' && (shiftDown || padBoost); }

  function step() {
    if (queue.length) dir = queue.shift();

    var h = snake[0];
    var nx = h.x + DIRS[dir][0], ny = h.y + DIRS[dir][1];
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return endGame(false);

    var eating = food && nx === food.x && ny === food.y;
    var limit = eating ? snake.length : snake.length - 1;   // 沒吃到時，尾巴會移開，可以踩過去
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === nx && snake[i].y === ny) return endGame(false);
    }

    snake.unshift({ x: nx, y: ny });
    if (eating) {
      score += 10;
      elScore.textContent = score;
      interval = Math.max(65, interval - 3);
      placeFood();
      if (!food) return endGame(true);
    } else {
      snake.pop();
    }
  }

  function endGame(win) {
    state = 'over';
    var record = score > hi;
    if (record) { hi = score; saveHi(hi); elHi.textContent = hi; }
    if (LEADERBOARD_URL && score > 0) {
      prefetch = api().catch(function () { return null; });
      prefetchRound = round;
    }
    syncUI(win, record);
    elScreen.classList.remove('shake');
    void elScreen.offsetWidth;
    elScreen.classList.add('shake');
  }

  /* ---------- 介面同步 ---------- */
  function syncUI(win, record) {
    overlay.classList.toggle('hide', state === 'playing');
    saveForm.hidden = true;
    setMsg('');
    if (state === 'ready') {
      ovTitle.textContent = '貪食蛇';
      ovText.innerHTML = touchUI
        ? '按十字鍵或在畫面上滑動<br>蛇就往那個方向走，按住「加速」衝刺'
        : '方向鍵／WASD：往該方向走<br>按住 Shift 加速，空白鍵暫停';
      ovBtn.textContent = '開始遊戲';
      btnMid.textContent = '開始';
    } else if (state === 'paused') {
      ovTitle.textContent = '暫停中';
      ovText.textContent = touchUI ? '按「繼續」接著玩' : '按空白鍵繼續';
      ovBtn.textContent = '繼續';
      btnMid.textContent = '繼續';
    } else if (state === 'over') {
      ovTitle.textContent = win ? '全部吃光！' : '遊戲結束';
      ovText.innerHTML = '分數：' + score + '<br>最高分：' + hi +
        (record && score > 0 ? '<br><span class="new">★ 新紀錄 ★</span>' : '');
      ovBtn.textContent = '重新開始';
      btnMid.textContent = '重新開始';
      if (!LEADERBOARD_URL) setMsg('（排行榜尚未設定網址）');
      else if (score > 0) { saveForm.hidden = false; nick.disabled = saveBtn.disabled = false; }
      else setMsg('吃到食物才能上排行榜');
    } else {
      btnMid.textContent = '暫停';
    }
  }

  function setMsg(text, cls) {
    saveMsg.hidden = !text;
    saveMsg.textContent = text;
    saveMsg.className = 'msg' + (cls ? ' ' + cls : '');
  }

  /* ---------- 雲端排行榜 ---------- */
  // 不帶 payload = GET 讀前 10 名；帶 payload = POST 存分數
  // POST 用 text/plain，瀏覽器才不會先送 OPTIONS 預檢（Apps Script 不支援）
  function api(payload) {
    if (!LEADERBOARD_URL) return Promise.reject(new Error('尚未設定排行榜網址'));
    var opts = payload ? {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    } : {};
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 20000);
    opts.signal = ctrl.signal;

    return fetch(LEADERBOARD_URL, opts)
      .then(function (r) {
        if (!r.ok) throw new Error('伺服器回應 ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data || !data.ok) throw new Error((data && data.error) || '回傳資料不正確');
        return data;
      })
      .catch(function (err) {
        if (err.name === 'AbortError') throw new Error('連線逾時，請再試一次');
        if (err.name === 'SyntaxError') throw new Error('回傳的不是 JSON，請檢查 /exec 網址與部署設定');
        if (err.name === 'TypeError') throw new Error('連不到排行榜，請檢查網路，或 Apps Script 存取權是否為「所有人」');
        throw err;
      })
      .finally(function () { clearTimeout(timer); });
  }

  // 暱稱比對：不分大小寫、忽略多餘空白
  function keyOf(name) {
    var s = String(name == null ? '' : name);
    if (s.normalize) s = s.normalize('NFKC');
    return s.replace(/\s+/g, ' ').trim().toLowerCase();
  }

  // 同一個暱稱只留最高分，再取前 10 名
  function bestOnly(rows) {
    var at = {}, list = [];
    (rows || []).forEach(function (r) {
      var k = keyOf(r && r.name), s = Number(r && r.score) || 0;
      if (!k) return;
      if (!(k in at)) { at[k] = list.length; list.push({ name: String(r.name), score: s, key: k }); }
      else if (s > list[at[k]].score) { list[at[k]].score = s; list[at[k]].name = String(r.name); }
    });
    list.sort(function (a, b) { return b.score - a.score; });
    return list.slice(0, 10);
  }

  function placeOf(list, key) {
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return i + 1;
    return 0;
  }

  try { nick.value = localStorage.getItem(NICK_KEY) || ''; } catch (e) { /* 讀不到就留空 */ }

  saveForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = nick.value.replace(/\s+/g, ' ').trim();
    if (!name) { setMsg('請先輸入暱稱', 'err'); nick.focus(); return; }
    nick.value = name;
    try { localStorage.setItem(NICK_KEY, name); } catch (err) { /* 無法儲存就略過 */ }

    var myRound = round, myScore = score, key = keyOf(name);
    nick.disabled = saveBtn.disabled = true;
    setMsg('儲存中…（第一次可能要等幾秒）');
    var board = (prefetch && prefetchRound === round) ? prefetch : api().catch(function () { return null; });
    board.then(function (res) {
      var list = res ? bestOnly(res.top) : [];
      var p = placeOf(list, key);
      // 榜上已經有這個暱稱、分數也不比這次低：不再多存一筆，排行榜維持最高分
      if (p && list[p - 1].score >= myScore) return { kept: true, top: res.top, best: list[p - 1].score };
      return api({ name: name, score: myScore }).then(function (r) {
        return { kept: false, top: r.top, place: r.place, unique: r.unique };
      });
    }).then(function (out) {
      if (myRound !== round) return;
      saveForm.hidden = true;
      var list = bestOnly(out.top), p = placeOf(list, key);
      if (out.kept) setMsg('這次 ' + myScore + ' 分，沒超過你的最高分 ' + out.best + ' 分，排行榜保留最高分', 'ok');
      else setMsg(p ? '已儲存！你是第 ' + p + ' 名' : '已儲存！這次還沒擠進前 10', 'ok');
      var status = p ? '★ 你目前第 ' + p + ' 名 ★' :
        (out.unique && out.place ? '你這次是第 ' + out.place + ' 名，再加油擠進前 10！' : '再加油擠進前 10！');
      openBoard({ top: out.top, key: key, status: status });
    }, function (err) {
      if (myRound !== round) return;
      nick.disabled = saveBtn.disabled = false;
      setMsg('儲存失敗：' + err.message, 'err');
    });
  });

  var lbReq = 0;   // 只採用最後一次讀取的結果

  // data 有值（剛存完分數）就直接顯示，不用再讀一次
  function openBoard(data) {
    if (state === 'playing') togglePause();
    if (!lb.open) lb.showModal();
    var id = ++lbReq;
    if (data) return renderBoard(data.top, data.key, data.status);

    lbRetry.hidden = true;
    lbList.textContent = '';
    setStatus('讀取中…');
    api().then(function (res) {
      if (id === lbReq) renderBoard(res.top, keyOf(nick.value), '');
    }, function (err) {
      if (id !== lbReq) return;
      setStatus('讀取失敗：' + err.message, 'err');
      lbRetry.hidden = false;
    });
  }

  function renderBoard(top, key, status) {
    lbRetry.hidden = false;
    lbList.textContent = '';
    var list = bestOnly(top);
    if (!list.length) return setStatus('還沒有人上榜，快來搶第一！');
    setStatus(status || '', status ? 'mine' : '');
    list.forEach(function (row, i) {
      var li = document.createElement('li');
      if (key && row.key === key) li.className = 'me';
      [['rk', (i + 1) + '.'], ['nm', row.name], ['sc', row.score]].forEach(function (c) {
        var span = document.createElement('span');
        span.className = c[0];
        span.textContent = c[1];   // 用 textContent，暱稱裡的 HTML 不會被執行
        li.appendChild(span);
      });
      lbList.appendChild(li);
    });
  }

  function setStatus(text, cls) {
    lbStatus.hidden = !text;
    lbStatus.textContent = text;
    lbStatus.className = 'lb-status' + (cls ? ' ' + cls : '');
  }

  document.getElementById('lbTop').addEventListener('click', function () { openBoard(); });
  document.getElementById('lbOv').addEventListener('click', function () { openBoard(); });
  document.getElementById('lbClose').addEventListener('click', function () { lb.close(); });
  lbRetry.addEventListener('click', function () { openBoard(); });
  // 點視窗外面（背景）也能關閉
  lb.addEventListener('click', function (e) {
    var r = lb.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) lb.close();
  });

  /* ---------- 繪圖 ---------- */
  function shade(t) {   // t = 0 靠近蛇頭、1 尾巴
    var c = [0, 1, 2].map(function (i) { return Math.round(NECK[i] + (TAIL[i] - NECK[i]) * t); });
    return 'rgb(' + c.join(',') + ')';
  }

  function drawCell(x, y, pad) {
    ctx.fillRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
  }

  function draw(t) {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, cv.width, cv.height);

    // 雷達格線：每格一條細線，每 5 格一條亮一點的線
    for (var g = 1; g < COLS; g++) {
      ctx.fillStyle = g % 5 ? 'rgba(110,190,255,.07)' : 'rgba(110,190,255,.16)';
      ctx.fillRect(g * CELL, 0, 1, cv.height);
      ctx.fillRect(0, g * CELL, cv.width, 1);
    }

    // 食物（閃爍）
    if (food) {
      var a = 0.65 + 0.35 * Math.sin(t / 160);
      ctx.shadowColor = '#ffb43a';
      ctx.shadowBlur = 14;
      ctx.fillStyle = 'rgba(255,180,58,' + a.toFixed(2) + ')';
      drawCell(food.x, food.y, 5);
      ctx.shadowBlur = 0;
    }

    // 蛇身：每一節都和前一節連起來，看得出整條路徑；顏色由亮到暗，尾巴畫細
    var n = snake.length;
    for (var i = n - 1; i >= 1; i--) {
      var s = snake[i], p = snake[i - 1];
      var half = CELL / 2 - (i === n - 1 ? 6 : 3);
      var x0 = Math.min(s.x, p.x) * CELL + CELL / 2, x1 = Math.max(s.x, p.x) * CELL + CELL / 2;
      var y0 = Math.min(s.y, p.y) * CELL + CELL / 2, y1 = Math.max(s.y, p.y) * CELL + CELL / 2;
      ctx.fillStyle = shade(n > 2 ? (i - 1) / (n - 2) : 0);
      ctx.fillRect(x0 - half, y0 - half, x1 - x0 + half * 2, y1 - y0 + half * 2);
    }

    // 蛇頭：近白色、較大，眼睛朝著前進方向
    var h = snake[0], f = DIRS[dir];
    ctx.shadowColor = '#3dff7a';
    ctx.shadowBlur = 14;
    ctx.fillStyle = HEAD;
    drawCell(h.x, h.y, 1);
    ctx.shadowBlur = 0;
    var hx = h.x * CELL + CELL / 2, hy = h.y * CELL + CELL / 2;
    ctx.fillStyle = BG;
    for (var k = -1; k <= 1; k += 2) {
      var ex = hx + f[0] * 5 - f[1] * 5 * k, ey = hy + f[1] * 5 + f[0] * 5 * k;
      ctx.fillRect(ex - 2, ey - 2, 4, 4);
    }

    // 邊框
    ctx.strokeStyle = 'rgba(61,255,122,.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, cv.width - 2, cv.height - 2);
  }

  function loop(now) {
    if (state === 'playing') {
      acc += Math.min(now - last, 250);
      var ms = boosting() ? Math.max(MIN_STEP, interval / BOOST) : interval;
      while (acc >= ms && state === 'playing') { acc -= ms; step(); }
    }
    last = now;
    var b = boosting();
    if (b !== boostShown) { boostShown = b; boostTag.classList.toggle('on', b); }
    draw(now);
    requestAnimationFrame(loop);
  }

  /* ---------- 操作 ---------- */
  // 輸入暱稱或看排行榜時，按鍵交給輸入框／視窗，不控制遊戲
  function typing(e) { return lb.open || e.target === nick; }

  document.addEventListener('keydown', function (e) {
    if (typing(e)) return;
    if (e.key === 'Shift') { shiftDown = true; return; }
    if (Object.prototype.hasOwnProperty.call(KEYS, e.code)) {
      e.preventDefault();
      setDir(KEYS[e.code]);
      return;
    }
    if (e.code === 'Space') {
      e.preventDefault();
      if (!e.repeat) action();
    } else if (e.code === 'KeyP' && !e.repeat && (state === 'playing' || state === 'paused')) {
      togglePause();
    }
  });
  // 避免焦點在按鈕上時，空白鍵放開又被當成「點擊」而重複觸發
  document.addEventListener('keyup', function (e) {
    if (e.key === 'Shift') shiftDown = false;
    if (e.code === 'Space' && !typing(e)) e.preventDefault();
  });
  window.addEventListener('blur', function () { shiftDown = padBoost = false; });

  ovBtn.addEventListener('click', function () { action(); ovBtn.blur(); });

  function bindPad(id, onDown, onUp) {
    var el = document.getElementById(id);
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      el.classList.add('pressed');
      onDown();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
      el.addEventListener(ev, function () {
        el.classList.remove('pressed');
        if (onUp) onUp();
      });
    });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    el.addEventListener('keydown', function (e) { if (e.code === 'Space') e.preventDefault(); });
  }
  bindPad('btnUp', function () { setDir(0); });
  bindPad('btnRight', function () { setDir(1); });
  bindPad('btnDown', function () { setDir(2); });
  bindPad('btnLeft', function () { setDir(3); });
  bindPad('btnMid', action);
  bindPad('btnBoost', function () { padBoost = true; }, function () { padBoost = false; });

  // 手機：在遊戲畫面上滑動，往滑的方向走；手指不放開也能連續轉彎
  var swipe = null;
  elScreen.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' || state !== 'playing') return;
    swipe = { id: e.pointerId, x: e.clientX, y: e.clientY };
  });
  elScreen.addEventListener('pointermove', function (e) {
    if (!swipe || e.pointerId !== swipe.id) return;
    var dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
    swipe.x = e.clientX;
    swipe.y = e.clientY;
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    elScreen.addEventListener(ev, function () { swipe = null; });
  });

  // 切到別的分頁時自動暫停
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      shiftDown = padBoost = false;
      if (state === 'playing') togglePause();
    }
  });

  reset();
  syncUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
